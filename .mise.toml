# =============================================================================
# dot_github — Development Environment
# =============================================================================
# Manages shared GitHub configurations for the axnic org:
# shared GitHub Actions workflows and the public org profile page.
#
# First run:
#   mise trust      # Trust this config (prompted on first use)
#   mise install    # Install all pinned tools
#   pnpm install    # Install commitlint (dev tooling only)
#
# Daily workflow:
#   mise run lint        # Check everything with rtunk
#   mise run lint:fix    # Fix what can be fixed
#
# All tasks and their short aliases:
#   lint                       (l)    — run rtunk (check only)
#   lint:fix                   (lf)   — run rtunk and auto-fix safe issues
#   lint:commitlint            (lc)   — commitlint: validate last commit message
#   ci:commitlint                     — commitlint on a range (args: --from/--to/--last)
#   ci:workflows                      — check workflow file naming convention
#   ci:workflows:test                 — self-test of the naming checker
# =============================================================================

# =============================================================================
# Settings
# =============================================================================
# jobs     = 8     — parallel tool installs and task executions (default: 4).
#                    Tune down if your machine has fewer cores.
# lockfile = true  — pin exact tool versions in mise.lock so the whole team
#                    installs identical binaries. Commit mise.lock to git.
# =============================================================================

[settings]
jobs = 8
lockfile = true
experimental = true

# =============================================================================
# Environment
# =============================================================================
# Extends PATH so that locally-installed npm binaries (commitlint, …)
# are available without a global install or `npx` prefix.
# =============================================================================

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# =============================================================================
# Tools
# =============================================================================

[tools]
node = "lts"     # JavaScript runtime — required by commitlint
pnpm = "10.33"   # Package manager — installs commitlint dev deps
"npm:@commitlint/cli" = "latest" # Commit convention check, drives .commitlintrc.js (`ci:commitlint`)
"github:axnic/rtunk" = "latest" # rtunk CLI (code quality platform, Trunk-compatible)

# =============================================================================
# Prepare
# =============================================================================
# Steps that run automatically after `mise install` (or `mise run prepare`).
# =============================================================================

[prepare.pnpm]
auto = true

# =============================================================================
# Linters
# =============================================================================
# rtunk is the single entrypoint for all linting and formatting. It runs all
# configured checks in one pass (see .rtunk/rtunk.yaml for the full list).
# =============================================================================

[tasks.lint]
description = "Lint all files with rtunk (check only)"
alias = "l"
run = "rtunk check ."

[tasks."lint:fix"]
description = "Lint all files with rtunk and auto-fix safe issues"
alias = "lf"
run = "rtunk check --fix ."

# -----------------------------------------------------------------------------
# commitlint — validates commit messages against the conventional commit rules
# defined in .commitlintrc.js. The commit-msg git hook (via rtunk actions) runs
# this automatically on commit.
#
# Docs: https://commitlint.js.org/#/cli
# Config: .commitlintrc.js
# -----------------------------------------------------------------------------

[tasks."lint:commitlint"]
description = "Validate the last commit message against conventional commit rules"
alias = "lc"
run = "commitlint --from HEAD~1 --to HEAD --verbose"

[tasks."ci:commitlint"]
description = "Validate commit messages in a range (usage: mise run ci:commitlint -- --from <sha> --to <sha> | --last)"
run = "commitlint --verbose"

# -----------------------------------------------------------------------------
# Workflow naming — central files are <group>.<action>.yaml; caller files are
# <triggers>.<action>.yaml (triggers sorted, equal to the `on:` keys).
# -----------------------------------------------------------------------------

[tasks."ci:workflows"]
description = "Check the naming convention of files in .github/workflows/"
run = "node scripts/check-workflow-names.mjs"

[tasks."ci:workflows:test"]
description = "Self-test of the workflow naming checker"
run = "node scripts/check-workflow-names.mjs --self-test"
