# Configuration of rtunk for this repository: the linters, runtimes and plugin sources that
# `rtunk check` and `rtunk fmt` use here. rtunk reads the trunk.yaml format.
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.6
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - checkov@3.2.521
    - git-diff-check
    - markdownlint@0.45.0
    - prettier@3.6.2
    - taplo@0.10.0
    - trufflehog@3.94.3
    - yamllint@1.38.0
actions:
  enabled:
    - commitlint
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
