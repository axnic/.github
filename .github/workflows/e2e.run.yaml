# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# E2E — end-to-end tests of the repository against one version of its dependency
# =============================================================================
# Reusable workflow: runs the repository's own E2E suite for ONE version (of the service the
# project is tested against, e.g. a Garage or Pocket-ID release). What the suite does, and how
# it starts the service, is defined by the repository in its `ci:e2e` mise task; this workflow
# only installs the tools and runs it with E2E_VERSION set.
#
# One caller file per version (see e2e.sync.yaml), because GitHub status badges are per
# workflow file, not per matrix leg.
#
#   e2e — `mise run ci:e2e`
#
# Inputs:
#   version  string, required — the exact version to test against; exposed to the task as the
#            environment variable E2E_VERSION (e.g. v2.3.0)
# Secrets:     none
# Permissions: the caller must grant `contents: read`
# Mise tasks:  `ci:e2e` (required; reads E2E_VERSION)
#
# Example call (merge_group,pull_request,push.e2e-v2.3.0.yaml, generated by e2e.sync.yaml):
#
#   name: E2E (v2.3.0)
#   on:
#     merge_group: {}
#     pull_request: {}
#     push:
#       branches: [main]
#   permissions: {}
#   jobs:
#     e2e:
#       permissions:
#         contents: read
#       uses: axnic/.github/.github/workflows/e2e.run.yaml@main
#       with:
#         version: v2.3.0
#       secrets: inherit
# =============================================================================

name: E2E

on:
  workflow_call:
    inputs:
      version:
        description: 'Exact version to test against, passed to the ci:e2e task as E2E_VERSION (e.g. "v2.3.0").'
        required: true
        type: string

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # e2e — run the repository's E2E suite for one version
  # ---------------------------------------------------------------------------
  e2e:
    name: 🧪 E2E (${{ inputs.version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🧪 Run E2E tests
        env:
          E2E_VERSION: ${{ inputs.version }}
        run: mise run ci:e2e
