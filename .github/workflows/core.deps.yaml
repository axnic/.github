# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Dependency Updates — auto-merge of Dependabot patch & security updates
# =============================================================================
# Reusable workflow for Dependabot's own PRs (github.actor). Callers must trigger it on
# pull_request (not pull_request_target): Dependabot PRs are same-repo, never a fork.
#
# What it does:
#   1. Reads the update's semver level and any associated GHSA advisory via
#      dependabot/fetch-metadata.
#   2. For patch updates, or a security update at any semver level, approves the PR and enables
#      GitHub's native auto-merge with an explicit, commit-convention-compliant subject
#      `<subject-prefix>: Bump <dependencies> from <old> to <new>`: Dependabot's own commit/PR-title
#      text never follows the convention. With merge-method `merge` the subject is the merge
#      commit's title, with `squash` the squash commit's title (the body is left empty in both
#      cases). The PR's own raw commits skip commitlint (see core.qa.yaml); this subject is what
#      lands on main and gets re-validated there (push runs --last).
#   3. Minor/major, non-security updates are left untouched: they stay open for manual review.
#   4. github-actions ecosystem updates are approved but never auto-merged: their diff always
#      edits a workflow file's `uses:` line, and the built-in GITHUB_TOKEN can never merge a
#      commit that touches .github/workflows/** (a hard GitHub restriction no `permissions:`
#      block can grant). These stay open for a human to merge.
#
# GitHub's native auto-merge only takes effect once the required status checks report success,
# so this can run immediately without waiting on them.
#
# One-time setup: the repository setting "Allow auto-merge" enabled (merge commits allowed), and
# main's required status checks configured.
#
# Inputs:
#   subject-prefix  string, default 'build(deps)' — what precedes ': Bump ...' in the merge
#                   subject; must match the repository's commit convention (e.g. '^[deps]')
#   merge-method    string, default 'merge' — 'merge' or 'squash'; anything else fails the job
# Secrets:     none (uses GITHUB_TOKEN)
# Permissions: the caller must grant `contents: write`, `pull-requests: write`
#
# Example call (pull_request.deps.yaml):
#
#   name: Dependency Updates
#   on:
#     pull_request:
#       branches: [main]
#   permissions: {}
#   jobs:
#     deps:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: axnic/.github/.github/workflows/core.deps.yaml@main
#       with:
#         subject-prefix: build(deps)
#         merge-method: merge
#       secrets: inherit
# =============================================================================

name: Dependency Updates

on:
  workflow_call:
    inputs:
      subject-prefix:
        description: "Prefix of the merge-commit subject, before ': Bump ...'."
        type: string
        default: build(deps)
      merge-method:
        description: "Auto-merge method: merge or squash."
        type: string
        default: merge

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # auto-merge — approve and enable auto-merge for patch/security updates
  # ---------------------------------------------------------------------------
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    name: 🤖 Approve & auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 🔎 Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-lookup: true

      - name: ✅ Approve
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.ghsa-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve \
            --body "Auto-approved: patch/security dependency update."

      - name: 🔀 Enable auto-merge
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.ghsa-id != '') &&
          steps.metadata.outputs.package-ecosystem != 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          SUBJECT_PREFIX: ${{ inputs.subject-prefix }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          case "$MERGE_METHOD" in
            merge | squash) ;;
            *)
              echo "::error::merge-method must be 'merge' or 'squash', got '$MERGE_METHOD'."
              exit 1
              ;;
          esac
          gh pr merge "$PR_URL" --auto "--$MERGE_METHOD" \
            --subject "$SUBJECT_PREFIX: Bump $DEPENDENCY_NAMES from $PREVIOUS_VERSION to $NEW_VERSION" \
            --body ""
