# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Terraform Validation — fmt, validate and module tests
# =============================================================================
# Local gate only: no backend, no secrets, no credentials. Terraform Cloud plans and applies
# (VCS-driven); this workflow never touches it.
#
#   fmt       — `mise run tf:fmt` (terraform fmt -check -recursive)
#   validate  — `mise run tf:validate` (init -backend=false + validate of terraform/live)
#   test      — `mise run tf:test` (`terraform test` in every terraform/modules/* with *.tftest.hcl)
# =============================================================================

name: Terraform Validation

on:
  merge_group: {}
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/templates/**"
      - ".github/workflows/merge_group,pull_request,push.terraform.yaml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/templates/**"
      - ".github/workflows/merge_group,pull_request,push.terraform.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # fmt — HCL formatting
  # ---------------------------------------------------------------------------
  fmt:
    name: 🎨 Format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🎨 Check formatting
        run: mise run tf:fmt

  # ---------------------------------------------------------------------------
  # validate — terraform/live, providers initialised without a backend
  # ---------------------------------------------------------------------------
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: ✅ Validate Terraform
        run: mise run tf:validate

  # ---------------------------------------------------------------------------
  # test — native terraform tests of the modules (mocked providers, no credentials)
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Module tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🧪 Run terraform test
        run: mise run tf:test
