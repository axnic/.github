# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# E2E Sync — add the E2E caller (and README badge) of every new version
# =============================================================================
# Reusable workflow: asks the repository which versions it should be tested against
# (`mise run ci:e2e:versions`, one exact version per line, the same string the ci:e2e task gets
# as E2E_VERSION), and for each version without a `merge_group,pull_request,push.e2e-<version>.yaml`
# caller in .github/workflows/:
#   - creates the caller from .github/templates/e2e-caller.yaml.tmpl of axnic/.github;
#   - adds a badge row after the last row of the README's e2e badge table, in the format of the
#     existing rows (no e2e badge table in the README = README left alone);
#   - commits on a new branch ci/e2e-<date> and opens a PR (idempotent: nothing new, or the branch
#     of the day already pushed, ends the run successfully without doing anything).
# Versions are validated against ^[A-Za-z0-9._-]+$ before use (they become file and branch names).
#
#   sync — detect, generate, commit, open the PR
#
# One-time setup: the repository setting "Allow GitHub Actions to create and approve pull requests".
# GITHUB_TOKEN can never push files under .github/workflows/ (it has no `workflows` permission), so
# this workflow mints a token from the axnic-bot GitHub App when CI_APP_ID and CI_APP_PRIVATE_KEY are
# both set; the app needs `contents: write`, `pull-requests: write` and `workflows: write` on the
# repository. Without them it falls back to GITHUB_TOKEN with a warning, and the push is refused.
# A PR opened with GITHUB_TOKEN also does not trigger the pull_request workflows (an App token does).
#
# Inputs:
#   readme-path     string, default 'README.md' — README holding the e2e badge table
#   commit-subject  string, default 'ci(ci): Sync E2E callers' — commit subject and PR title;
#                   must satisfy the repository's commitlint (mandatory scope)
# Secrets:     CI_APP_ID, CI_APP_PRIVATE_KEY (both optional, see above; fallback GITHUB_TOKEN)
# Permissions: the caller must grant `contents: write`, `pull-requests: write`
# Mise tasks:  `ci:e2e:versions` (required)
#
# Example call (schedule,workflow_dispatch.e2e-sync.yaml):
#
#   name: E2E Sync
#   on:
#     schedule:
#       - cron: 0 3 * * 1
#     workflow_dispatch: {}
#   permissions: {}
#   jobs:
#     sync:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: axnic/.github/.github/workflows/e2e.sync.yaml@main
#       with:
#         commit-subject: ci(ci): Sync E2E callers
#       secrets: inherit
# =============================================================================

name: E2E Sync

on:
  workflow_call:
    secrets:
      CI_APP_ID:
        description: "ID of the axnic-bot GitHub App (needs workflows: write); optional."
        required: false
      CI_APP_PRIVATE_KEY:
        description: "Private key of the axnic-bot GitHub App; optional."
        required: false
    inputs:
      readme-path:
        description: "README holding the e2e badge table."
        type: string
        default: README.md
      commit-subject:
        description: "Commit subject and PR title (must pass the repository's commitlint)."
        type: string
        default: "ci(ci): Sync E2E callers"

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # sync — detect new versions, generate their callers, open a PR
  # ---------------------------------------------------------------------------
  sync:
    name: 🔄 Sync E2E callers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 🔑 Check for the GitHub App credentials
        id: app
        run: |
          if [ -n "$CI_APP_ID" ] && [ -n "$CI_APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CI_APP_ID / CI_APP_PRIVATE_KEY are not set: falling back to GITHUB_TOKEN, which cannot push files under .github/workflows/ (the push will be refused). Install the axnic-bot GitHub App (workflows: write) and expose its secrets."
          fi
        env:
          CI_APP_ID: ${{ secrets.CI_APP_ID }}
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: 🔑 Generate a GitHub App token
        id: token
        if: steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token || github.token }}

      - name: ⬇️ Checkout the shared template and script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axnic/.github
          path: .e2e-sync-central
          sparse-checkout: |
            scripts/e2e-sync.mjs
            .github/templates
          persist-credentials: false

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🔎 Generate the missing callers
        id: gen
        run: |
          set -euo pipefail
          mise run --quiet ci:e2e:versions > "$RUNNER_TEMP/versions.txt"
          central=.e2e-sync-central
          node "$central/scripts/e2e-sync.mjs" \
            --workflows .github/workflows \
            --template "$central/.github/templates/e2e-caller.yaml.tmpl" \
            --readme "$README_PATH" \
            < "$RUNNER_TEMP/versions.txt" > "$RUNNER_TEMP/new-versions.txt"
          if [ -s "$RUNNER_TEMP/new-versions.txt" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New versions: $(paste -sd' ' "$RUNNER_TEMP/new-versions.txt")"
          else
            echo "No new E2E version."
          fi
        env:
          README_PATH: ${{ inputs.readme-path }}

      - name: 📬 Commit and open the PR
        if: steps.gen.outputs.new == 'true'
        run: |
          set -euo pipefail
          branch="ci/e2e-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Branch $branch already exists: its PR is already open or was closed, nothing to do."
            exit 0
          fi
          versions=$(paste -sd' ' "$RUNNER_TEMP/new-versions.txt")
          body=$(printf 'Adds the E2E caller and README badge for the new versions:\n\n%s\n\nGenerated by the e2e.sync workflow of axnic/.github.' \
            "$(sed 's/^/- /' "$RUNNER_TEMP/new-versions.txt")")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows/merge_group,pull_request,push.e2e-*.yaml
          git add -- "$README_PATH" || true
          git commit --signoff -m "$COMMIT_SUBJECT" -m "$body"
          git push origin "$branch"
          base=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          gh pr create --base "$base" --head "$branch" --title "$COMMIT_SUBJECT" --body "$body"
          echo "Opened a PR for: $versions"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || github.token }}
          README_PATH: ${{ inputs.readme-path }}
          COMMIT_SUBJECT: ${{ inputs.commit-subject }}
