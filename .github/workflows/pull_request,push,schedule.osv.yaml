# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# OSV-Scanner — Known vulnerabilities in the lockfiles, in code scanning
# =============================================================================
# Scans the repository's manifests and lockfiles with OSV-Scanner on every pull request (only the
# vulnerabilities it introduces), on push to the default branch and weekly. The findings are
# uploaded to the Security tab (code scanning).
#
# Jobs:
#   osv — OSV-Scanner SARIF scan, from security.osv
#
# Hand-written: this repository is not generated by the Terraform workflows module, so its callers
# reference the central workflows locally.
# =============================================================================

name: OSV-Scanner

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: 30 5 * * 1

concurrency:
  group: osv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # osv — OSV-Scanner SARIF scan, from security.osv
  # ---------------------------------------------------------------------------
  osv:
    name: 🛡️ OSV-Scanner
    uses: ./.github/workflows/security.osv.yaml
    permissions:
      actions: read
      contents: read
      security-events: write
