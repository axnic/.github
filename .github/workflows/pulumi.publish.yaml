# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Release — publish a Pulumi provider and its SDKs (stage 2 of 2)
# =============================================================================
# Reusable workflow, second job of a Pulumi provider repository's Release caller
# (`needs: prepare`, see release.prepare.yaml for the full caller; this file replaces
# go.publish.yaml there and takes `sdks` instead of `prerelease`). Works on the tag and DRAFT
# release that release.prepare created. The provider name comes from the repository name
# (pulumi-<name>); nothing is specific to one provider.
#
#   provider  — goreleaser build of the provider (the repository's .goreleaser.yml) without
#               letting goreleaser publish (`--skip=publish`); archives and checksums are attached
#               to the draft release, a SLSA build provenance attestation is recorded for every
#               archive, then the release is PUBLISHED (no longer a draft): the SDKs below are
#               public as soon as they are pushed, and `pulumi plugin install resource <name>
#               <version>` downloads the provider from the published release only
#   go-sdk    — pushes the tag sdk/go/<repository>/v<version> on the release commit, so
#               `go get github.com/<owner>/<repository>/sdk/go/<repository>@v<version>` resolves to
#               a clean version (Go modules in a subdirectory need a tag prefixed with it). Fails
#               when sdk/go/<repository> does not exist; a re-run is a no-op
#   nodejs    — `make nodejs_sdk`, then `npm publish --provenance` (dist-tag `next` for a
#               prerelease, npm refuses `latest` for it). Auth: npm trusted publishing (OIDC),
#               bound to the CALLER workflow file name (workflow_dispatch.release.yaml); NPM_TOKEN
#               is only a fallback when set. Skipped when the version is already on npm
#   python    — `make python_sdk`, then twine (`--skip-existing`) with PYPI_API_TOKEN; skipped
#               when the secret is missing. pip ignores prereleases unless asked
#   dotnet    — `make dotnet_sdk`, then `dotnet nuget push --skip-duplicate`. Auth: NuGet trusted
#               publishing (OIDC through NuGet/login, needs the NUGET_USER secret = the nuget.org
#               profile name), else NUGET_API_KEY; skipped when neither is set
#
# Each SDK job runs only when listed in `sdks`, and is its own job so a failed registry can be
# re-run alone ("Re-run failed jobs"); every step is idempotent.
#
# Verification of a provider archive (replace <owner>/<repo>, <file>):
#
#   gh attestation verify <file> -R <owner>/<repo> \
#     --signer-workflow axnic/.github/.github/workflows/pulumi.publish.yaml
#
# Inputs:
#   tag      string, required — the tag pushed by release.prepare (v<version>)
#   version  string, required — the version without "v" (PROVIDER_VERSION of the Makefile)
#   sdks     string, default '["nodejs","python","dotnet"]' — JSON array of the SDKs to publish
# Secrets (all optional, see each job):
#   NPM_TOKEN       npm fallback when trusted publishing is not set up
#   PYPI_API_TOKEN  PyPI API token; without it the python SDK is skipped
#   NUGET_USER      nuget.org user of the trusted publishing policy (OIDC)
#   NUGET_API_KEY   NuGet fallback when NUGET_USER is not set
# Permissions: the caller must grant `contents: write`, `id-token: write`, `attestations: write`
# Mise tasks:  none (Makefile targets `nodejs_sdk`, `python_sdk`, `dotnet_sdk` of the Pulumi
#              provider boilerplate; tools go, pulumi, pulumictl, node, yarn, python, dotnet)
#
# Example call (job `publish` of workflow_dispatch.release.yaml):
#
#   publish:
#     needs: prepare
#     permissions:
#       contents: write
#       id-token: write
#       attestations: write
#     uses: axnic/.github/.github/workflows/pulumi.publish.yaml@main
#     with:
#       tag: ${{ needs.prepare.outputs.tag }}
#       version: ${{ needs.prepare.outputs.version }}
#       sdks: '["nodejs","python","dotnet"]'
#     secrets: inherit
# =============================================================================

name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag pushed by release.prepare (v<version>).
        type: string
        required: true
      version:
        description: Version without the leading v.
        type: string
        required: true
      sdks:
        description: JSON array of the SDKs to publish (nodejs, python, dotnet).
        type: string
        default: '["nodejs","python","dotnet"]'
    secrets:
      NPM_TOKEN:
        description: npm token, fallback when npm trusted publishing is not set up.
        required: false
      PYPI_API_TOKEN:
        description: PyPI API token. Without it the python SDK is skipped.
        required: false
      NUGET_USER:
        description: nuget.org user of the NuGet trusted publishing policy.
        required: false
      NUGET_API_KEY:
        description: NuGet API key, fallback when NUGET_USER is not set.
        required: false

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # provider — provider binaries on the release, provenance, release published
  # ---------------------------------------------------------------------------
  provider:
    name: 🚀 Provider binaries (${{ inputs.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads to the release and publishes it
      id-token: write # OIDC token for the build provenance
      attestations: write # stores the build provenance attestation

    steps:
      - name: ⬇️ Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      # The notes are already on the draft release: an empty notes file only stops goreleaser
      # from building a changelog it would not use.
      - name: 📄 Prepare goreleaser
        run: ': > "$RUNNER_TEMP/notes.md"'

      - name: 🏗️ Build with goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ~> v2
          args: release --clean --skip=publish --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬆️ Attach provider binaries to the release
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mapfile -t files < <(jq -r '.[] | select(.type | IN("Archive","Checksum","Signature","Certificate","SBOM")) | .path' dist/artifacts.json)
          CHECKSUMS=$(jq -r 'first(.[] | select(.type == "Checksum") | .path) // empty' dist/artifacts.json)
          if [[ -z "$CHECKSUMS" ]]; then
            echo "::error::.goreleaser.yml produced no checksums file."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "checksums=$CHECKSUMS" >> "$GITHUB_OUTPUT"

      - name: 🛡️ Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}

      # The prerelease flag set by release.prepare is kept.
      - name: 📣 Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false

  # ---------------------------------------------------------------------------
  # go-sdk — sdk/go/<repository>/v<version> tag for Go module resolution
  # ---------------------------------------------------------------------------
  go-sdk:
    name: 🏷️ Go SDK tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag

    steps:
      - name: ⬇️ Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: 🏷️ Push the Go SDK tag
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          SDK_DIR="sdk/go/${REPOSITORY_NAME}"
          SDK_TAG="${SDK_DIR}/${TAG}"
          if [[ ! -f "${SDK_DIR}/go.mod" ]]; then
            echo "::error::${SDK_DIR}/go.mod not found: the Go SDK must live in sdk/go/<repository name>."
            exit 1
          fi
          COMMIT=$(git rev-parse "${TAG}^{commit}")
          EXISTING=$(git ls-remote origin "refs/tags/${SDK_TAG}" | cut -f1)
          if [[ -n "$EXISTING" ]]; then
            if [[ "$EXISTING" != "$COMMIT" ]]; then
              echo "::error::${SDK_TAG} already exists on another commit (${EXISTING})."
              exit 1
            fi
            echo "::notice::${SDK_TAG} already exists - nothing to do."
            exit 0
          fi
          git tag "$SDK_TAG" "$COMMIT"
          git push origin "refs/tags/${SDK_TAG}"
          echo "::notice::Pushed ${SDK_TAG}."

  # ---------------------------------------------------------------------------
  # nodejs — npm package (trusted publishing, NPM_TOKEN fallback)
  # ---------------------------------------------------------------------------
  nodejs:
    name: 📦 Node.js SDK (npm)
    if: contains(fromJSON(inputs.sdks), 'nodejs')
    needs: provider
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: ⬇️ Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🏗️ Build the Node.js SDK
        env:
          PROVIDER_VERSION: ${{ inputs.version }}
        run: make nodejs_sdk PROVIDER_VERSION="$PROVIDER_VERSION"

      - name: 🚀 Publish to npm
        working-directory: sdk/nodejs/bin
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [[ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" ]]; then
            echo "::notice::${NAME}@${VERSION} is already on npm - nothing to do."
            exit 0
          fi
          # Without NPM_TOKEN, npm exchanges the OIDC token (trusted publishing).
          if [[ -n "$NPM_TOKEN" ]]; then
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
            # Single quotes on purpose: npm expands ${NPM_TOKEN} from the environment itself.
            # shellcheck disable=SC2016
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi
          # npm refuses to publish a prerelease to the default `latest` dist-tag.
          DIST_TAG=latest
          [[ "$VERSION" == *-* ]] && DIST_TAG=next
          npm publish --access public --provenance --tag "$DIST_TAG"

  # ---------------------------------------------------------------------------
  # python — PyPI package (PYPI_API_TOKEN)
  # ---------------------------------------------------------------------------
  python:
    name: 📦 Python SDK (PyPI)
    if: contains(fromJSON(inputs.sdks), 'python')
    needs: provider
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # `if:` cannot read the secrets context: the check is a step.
      - name: 🔎 Check the PyPI credential
        id: credential
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [[ -n "$PYPI_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN is not set - the python SDK is not published."
          fi

      - name: ⬇️ Checkout tag
        if: steps.credential.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: 🔧 Install tools via mise
        if: steps.credential.outputs.enabled == 'true'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🏗️ Build the Python SDK
        if: steps.credential.outputs.enabled == 'true'
        env:
          PROVIDER_VERSION: ${{ inputs.version }}
        run: make python_sdk PROVIDER_VERSION="$PROVIDER_VERSION"

      # make python_sdk creates the venv in sdk/python/, one level up from sdk/python/bin/ where
      # the build output (dist/) lands.
      - name: 🚀 Publish to PyPI
        if: steps.credential.outputs.enabled == 'true'
        working-directory: sdk/python/bin
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          ../venv/bin/python -m pip install twine
          ../venv/bin/python -m twine upload --skip-existing dist/*

  # ---------------------------------------------------------------------------
  # dotnet — NuGet package (trusted publishing, NUGET_API_KEY fallback)
  # ---------------------------------------------------------------------------
  dotnet:
    name: 📦 .NET SDK (NuGet)
    if: contains(fromJSON(inputs.sdks), 'dotnet')
    needs: provider
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing

    steps:
      # `if:` cannot read the secrets context: the check is a step.
      - name: 🔎 Check the NuGet credential
        id: credential
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -n "$NUGET_USER" ]]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [[ -n "$NUGET_API_KEY" ]]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Neither NUGET_USER nor NUGET_API_KEY is set - the dotnet SDK is not published."
          fi

      - name: ⬇️ Checkout tag
        if: steps.credential.outputs.mode != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: 🔧 Install tools via mise
        if: steps.credential.outputs.mode != 'none'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🏗️ Build the .NET SDK
        if: steps.credential.outputs.mode != 'none'
        env:
          PROVIDER_VERSION: ${{ inputs.version }}
        run: make dotnet_sdk PROVIDER_VERSION="$PROVIDER_VERSION"

      - name: 🔑 Login to NuGet (OIDC → temporary API key)
        id: nuget_login
        if: steps.credential.outputs.mode == 'oidc'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 🚀 Publish to NuGet
        if: steps.credential.outputs.mode != 'none'
        env:
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "sdk/dotnet/bin/Debug/*.nupkg" \
            --api-key "$NUGET_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
